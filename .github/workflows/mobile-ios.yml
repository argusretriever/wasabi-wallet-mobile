name: iOS Simulator

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mobile-ios.yml'
      - 'WalletWasabi.Mobile*/**'
      - 'WalletWasabi.Client/**'
      - 'WalletWasabi/**'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'global.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/mobile-dotnet
        with:
          dotnet-version: '10.0.401'
      - name: Install the iOS workload
        run: |
          xcodebuild -version
          dotnet workload install ios --version 10.0.401
      - name: Build the ARM64 simulator app
        run: |
          dotnet build WalletWasabi.Mobile.iOS/WalletWasabi.Mobile.iOS.csproj \
            --configuration Debug --runtime iossimulator-arm64 \
            -p:TrimMode=copy -p:UseInterpreter=true -p:IncludeDesktopTools=false -m:1
      - name: Package the simulator app
        run: |
          app=$(find WalletWasabi.Mobile.iOS/bin/Debug -type d -name '*.app' -prune -print -quit)
          test -n "$app"
          ditto -c -k --keepParent "$app" Wasabi-Mobile-iOS-Simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wasabi-Mobile-iOS-Simulator
          path: Wasabi-Mobile-iOS-Simulator.zip
          if-no-files-found: error
      - name: Check simulator launch
        timeout-minutes: 8
        run: |
          app=$(find WalletWasabi.Mobile.iOS/bin/Debug -type d -name '*.app' -prune -print -quit)
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          device=$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
             | .value[] | select(.isAvailable and (.name | startswith("iPhone")))]
            | first | .udid // empty
          ')
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          launch=$(xcrun simctl launch --stdout="$RUNNER_TEMP/wallet-ios.stdout" \
            --stderr="$RUNNER_TEMP/wallet-ios.stderr" "$device" "$bundle_id")
          echo "$launch"
          pid=${launch##*: }
          [[ "$pid" =~ ^[0-9]+$ ]]
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            for log in "$RUNNER_TEMP/wallet-ios.stdout" "$RUNNER_TEMP/wallet-ios.stderr"; do
              if [[ -f "$log" ]]; then cat "$log"; fi
            done
            xcrun simctl spawn "$device" log show --last 1m \
              --predicate "processID == $pid" --style compact || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 \
              -name 'WalletWasabi.Mobile.iOS*.ips' -mmin -2 -exec cat {} \; || true
            echo "::error::The wallet exited shortly after launch."
            exit 1
          fi
